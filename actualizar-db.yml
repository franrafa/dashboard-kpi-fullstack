name: Actualizar Base de Datos en Railway

on:
  push:
    branches:
      - main
    paths:
      - 'FullStack_Consolidado.xlsx'
      - '.github/workflows/actualizar-db.yml'
      - 'migrar_datos.py' 

  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  update-database:
    runs-on: ubuntu-latest
    
    steps:
      - name: 1. Descargar el código
        uses: actions/checkout@v4

      - name: 2. Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 3. Instalar las librerías necesarias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: 4. Ejecutar el script de migración
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
        run: |
          python migrar_datos.py